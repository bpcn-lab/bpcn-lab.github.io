name: Accessibility or privacy correction
description: Report an accessibility barrier or request correction/removal of personal data.
title: "[Correction] "
labels: ["accessibility", "privacy"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options: [Accessibility barrier, Privacy / personal data correction, Privacy / removal request]
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL (if applicable)
  - type: textarea
    id: details
    attributes:
      label: Description
    validations:
      required: true
